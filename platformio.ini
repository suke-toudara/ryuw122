; PlatformIO project configuration - RYUW122 UWB firmware (ESP32-C6 / ESP-IDF)
;
;   pio run -e anchor -t menuconfig    設定を変更する
;   pio run -e anchor -t upload        ANCHOR 機に書き込む
;   pio run -e tag    -t upload        TAG 機に書き込む
;   pio device monitor -b 115200       ログを見る
;
; ESP32-C6 に対応した platform として pioarduino 版を使用しています
; (PlatformIO 公式の espressif32 は C6 + ESP-IDF 5.x に未対応のため)。
; PlatformIO Core 6.1.16 以降が必要です。

[platformio]
; ESP-IDF 標準の main/ をそのままソースディレクトリとして使う
; (idf.py でもビルドできる構成を保つため)
src_dir = main
default_envs = anchor

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp_idf_exception_decoder, time
; 各 env の Kconfig 値は configs/<role>.defaults を初期値として
; sdkconfig.<env 名> に生成されます。

[env:anchor]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=configs/anchor.defaults

[env:tag]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=configs/tag.defaults
